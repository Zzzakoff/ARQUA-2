openapi: "3.0.3"
info:
  title: Edge Cases API
  version: "1.0.0"
paths:
  /items:
    get:
      summary: List items
      description: Returns all items.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
  /legacy:
    get:
      summary: Legacy endpoint
      description: This endpoint should exist in code too.
      responses:
        "200":
          description: OK
  /typed:
    get:
      summary: Typed endpoint
      description: Returns a counter.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer