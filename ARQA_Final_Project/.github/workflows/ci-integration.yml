name: CI integration

on:
  pull_request:
  push:
    branches: [main, develop, ci-integration]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Путь к спецификации OpenAPI в репозитории'
        default: tests/fixtures/specs/drift_lab.yaml
        required: true
        type: string
      source:
        description: 'Каталог исходников FastAPI в репозитории'
        default: tests/fixtures/apps/drift_lab_app
        required: true
        type: string
      fail_on:
        description: 'Порог провала проверки: none — только отчёт'
        default: none
        type: choice
        options: [none, error, warning]

permissions:
  contents: read

concurrency:
  group: ci-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q --junitxml="${{ runner.temp }}/tests.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/tests.xml
          retention-days: 14

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install .
      - name: Check API and write summary
        env:
          SPEC: ${{ inputs.spec || 'tests/fixtures/specs/drift_lab.yaml' }}
          SOURCE: ${{ inputs.source || 'tests/fixtures/apps/drift_lab_app' }}
          FAIL_ON: ${{ inputs.fail_on || 'none' }}
          REPORT_DIR: ${{ runner.temp }}/api-report
        run: >-
          python .github/scripts/ci_check.py
          --spec "$SPEC" --src "$SOURCE"
          --fail-on "$FAIL_ON" --output "$REPORT_DIR"
      - name: Save API reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: ${{ runner.temp }}/api-report/
          retention-days: 14
