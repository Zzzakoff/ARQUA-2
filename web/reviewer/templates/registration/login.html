{% extends 'reviewer/base.html' %}
{% block title %}Вход — Patch Review{% endblock %}

{% block content %}
<div class="login-wrap fade-up">
  <div class="login-card">
    <div class="login-emblem"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="login-title h3">Вход ревьюера</h1>
    <p class="login-copy">Авторизуйся, чтобы принимать, отклонять и редактировать patch proposals.</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Неверный логин или пароль.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <div class="position-relative">
          <input class="form-control ps-4" name="username" autocomplete="username" required autofocus placeholder="reviewer">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Войти в workspace</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</div>
{% endblock %}
